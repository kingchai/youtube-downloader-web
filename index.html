<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube 视频下载器</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --card: #151b24; --line: #293241; --text: #f4f7fb; --muted: #9aa7b8; --accent: #ff4d67; --accent-2: #ff845e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: radial-gradient(circle at 10% 0%, #2a1527 0, transparent 38%), radial-gradient(circle at 100% 0%, #142846 0, transparent 42%), var(--bg); }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0 48px; }
    .eyebrow { color: #ff9d8e; letter-spacing: .12em; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(34px, 7vw, 68px); line-height: 1.05; letter-spacing: -.05em; }
    .lead { max-width: 650px; margin: 0 0 36px; color: var(--muted); font-size: 17px; line-height: 1.7; }
    .card { border: 1px solid var(--line); border-radius: 24px; padding: clamp(20px, 4vw, 36px); background: color-mix(in srgb, var(--card) 88%, transparent); box-shadow: 0 24px 80px rgba(0,0,0,.24); }
    label { display: block; margin: 0 0 10px; font-weight: 700; }
    input, select, button { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 15px 16px; color: var(--text); background: #0f141c; font: inherit; }
    input:focus, select:focus { outline: 2px solid #ff6475; outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 220px; gap: 16px; }
    .actions { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
    button { cursor: pointer; border: 0; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    button:disabled { cursor: wait; opacity: .55; }
    .status { min-height: 24px; color: var(--muted); font-size: 14px; }
    .status.error { color: #ff9a9a; }
    .status.ok { color: #8ee2b0; }
    .note { margin-top: 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    @media (max-width: 680px) { main { padding-top: 44px; } .grid { grid-template-columns: 1fr; } .actions { display: block; } .status { margin-top: 14px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Local media utility</div>
    <h1>YouTube<br>视频下载器</h1>
    <p class="lead">粘贴一个 YouTube 视频地址，选择需要的格式，服务端完成下载后会自动返回文件。</p>
    <section class="card" aria-labelledby="download-title">
      <h2 id="download-title">开始下载</h2>
      <div class="grid">
        <div>
          <label for="url">YouTube 视频地址</label>
          <input id="url" type="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>
        <div>
          <label for="format">下载格式</label>
          <select id="format">
            <option value="mp4-1080p">MP4 · 1080p</option>
            <option value="mp4-720p">MP4 · 720p</option>
            <option value="best">最佳可用画质</option>
            <option value="webm">WebM</option>
            <option value="mp3">MP3 音频</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="download" type="button">下载视频</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
      <p class="note">仅下载你有权保存和使用的内容。播放列表参数默认按单个视频处理；下载时间取决于视频长度和服务器网络。</p>
    </section>
  </main>
  <script>
    const urlInput = document.querySelector('#url');
    const formatInput = document.querySelector('#format');
    const button = document.querySelector('#download');
    const status = document.querySelector('#status');

    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = `status ${kind}`;
    }

    button.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) { setStatus('请先输入 YouTube 视频地址。', 'error'); urlInput.focus(); return; }
      button.disabled = true;
      setStatus('正在下载并整理文件，请稍候…');
      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format: formatInput.value })
        });
        if (!response.ok) {
          let message = '下载失败，请检查地址或稍后重试。';
          try { message = (await response.json()).error || message; } catch (_) {}
          throw new Error(message);
        }
        const blob = await response.blob();
        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        const filename = match ? decodeURIComponent(match[1]) : 'youtube-download';
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        setStatus('下载完成，文件已保存到浏览器的下载目录。', 'ok');
      } catch (error) {
        setStatus(error.message || '下载失败。', 'error');
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
